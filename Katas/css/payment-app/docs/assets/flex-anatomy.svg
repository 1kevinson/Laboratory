.code-2xs{font:500 10px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#333}
.tag{font:700 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:.06em}
</style><marker id="m3b74d4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b74d4"/></marker><marker id="m3b74d4s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b74d4"/></marker><marker id="m3fa874" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fa874"/></marker><marker id="m3fa874s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fa874"/></marker><marker id="me0703f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0703f"/></marker><marker id="me0703fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0703f"/></marker></defs>
<rect width="1100" height="450" rx="16" fill="#ffffff"/>
<text x="320" y="34" class="title" text-anchor="middle">flex-direction: row  (default)</text>
<rect x="40" y="70" width="560" height="180" rx="10" fill="#e3ecf8" stroke="#3b74d4" stroke-width="2.5"/>
<line x1="48" y1="160.0" x2="592" y2="160.0" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="60" y="130.0" width="110" height="60" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
<text x="115.0" y="165.0" class="code-xs" text-anchor="middle">item 1</text>
<rect x="170" y="84" width="24" height="152" rx="3" fill="#ececec"/>
<text x="186" y="160.0" class="xs" text-anchor="middle" transform="rotate(-90 186 160.0)">gap</text>
<rect x="194" y="105.0" width="160" height="110" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
<text x="274.0" y="165.0" class="code-xs" text-anchor="middle">item 2</text>
<rect x="354" y="84" width="24" height="152" rx="3" fill="#ececec"/>
<text x="370" y="160.0" class="xs" text-anchor="middle" transform="rotate(-90 370 160.0)">gap</text>
<rect x="378" y="120.0" width="90" height="80" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
<text x="423.0" y="165.0" class="code-xs" text-anchor="middle">item 3</text>
<rect x="474" y="84" width="106" height="152" rx="6" fill="none" stroke="#bdbdbd" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="527.0" y="156.0" class="sm" text-anchor="middle">free space</text>
<text x="527.0" y="174.0" class="code-2xs" text-anchor="middle" style="fill:#3b74d4">justify-content</text>
<text x="42" y="60" class="code-2xs" text-anchor="start" style="fill:#3b74d4">align-items: center → every item centred on the dotted cross-axis midline</text>
<line x1="40" y1="284" x2="600" y2="284" stroke="#3b74d4" stroke-width="2.5" marker-end="url(#m3b74d4)"/>
<text x="320.0" y="306" class="lbl" text-anchor="middle">main axis  → items line up along it</text>
<text x="40" y="274" class="xs" text-anchor="start">main-start</text>
<text x="600" y="274" class="xs" text-anchor="end">main-end</text>
<line x1="22" y1="70" x2="22" y2="250" stroke="#e0703f" stroke-width="2.5" marker-end="url(#me0703f)"/>
<text x="12" y="160.0" class="sm" text-anchor="middle" transform="rotate(-90 12 160.0)" style="fill:#e0703f">cross axis</text>
<text x="40" y="350" class="code-xs" text-anchor="start">justify-content  → shares the free space along the MAIN axis</text>
<text x="40" y="370" class="code-xs" text-anchor="start">align-items      → places items along the CROSS axis</text>
<text x="40" y="390" class="code-xs" text-anchor="start">gap              → fixed space BETWEEN items (never outside)</text>
<text x="865" y="34" class="title" text-anchor="middle">flex-direction: column</text>
<rect x="720" y="60" width="290" height="300" rx="10" fill="#e1f2e9" stroke="#3fa874" stroke-width="2.5"/>
<rect x="736" y="76" width="258" height="44" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
<text x="865.0" y="102.0" class="code-xs" text-anchor="middle">block 1</text>
<rect x="736" y="120" width="258" height="16" rx="3" fill="#ececec"/>
<text x="865.0" y="132" class="xs" text-anchor="middle">gap</text>
<rect x="736" y="136" width="258" height="70" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
<text x="865.0" y="175.0" class="code-xs" text-anchor="middle">block 2</text>
<rect x="736" y="206" width="258" height="16" rx="3" fill="#ececec"/>
<text x="865.0" y="218" class="xs" text-anchor="middle">gap</text>
<rect x="736" y="222" width="258" height="40" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
<text x="865.0" y="246.0" class="code-xs" text-anchor="middle">block 3</text>
<rect x="736" y="268" width="258" height="76" rx="6" fill="none" stroke="#bdbdbd" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="865.0" y="311.0" class="sm" text-anchor="middle">free space</text>
<line x1="1036" y1="60" x2="1036" y2="360" stroke="#3fa874" stroke-width="2.5" marker-end="url(#m3fa874)"/>
<text x="1056" y="210.0" class="sm" text-anchor="middle" transform="rotate(-90 1056 210.0)" style="fill:#3fa874">main axis</text>
<line x1="720" y1="382" x2="1010" y2="382" stroke="#e0703f" stroke-width="2.5" marker-end="url(#me0703f)"/>
<text x="865.0" y="402" class="sm" text-anchor="middle">cross axis → items stretch by default</text>
<text x="865.0" y="432" class="code-xs" text-anchor="middle" style="fill:#3fa874">= every .l-phone-view-*</text>
</svg>
