.code-sm{font:500 12px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#333}
.code-xs{font:500 11px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#333}
.code-2xs{font:500 10px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#333}
.tag{font:700 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:.06em}
</style></defs>
<rect width="1160" height="470" rx="16" fill="#ffffff"/>
<rect x="24" y="40" width="470" height="308" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="40" y="64" class="xs" text-anchor="start">layout/_global-wrapper.scss + layout/_phone-view.scss</text>
<text x="40" y="86" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">.l-global-wrapper</tspan><tspan> {</tspan></text>
<text x="40" y="106" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a5cd1">  display</tspan><tspan>: grid;</tspan></text>
<text x="40" y="126" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a5cd1">  grid-template-columns</tspan><tspan>: 1fr repeat(3, $phone-width) 1fr;</tspan></text>
<text x="40" y="146" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a5cd1">  grid-template-rows</tspan><tspan>: 1fr $phone-height 1fr;</tspan></text>
<text x="40" y="166" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a5cd1">  grid-template-areas</tspan><tspan>:</tspan></text>
<text x="40" y="186" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>    &quot;. . . . .&quot;</tspan></text>
<text x="40" y="206" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>    &quot;. </tspan><tspan style="fill:#3fa874;font-weight:800">phone-first</tspan><tspan> </tspan><tspan style="fill:#3b74d4;font-weight:800">phone-second</tspan><tspan> </tspan><tspan style="fill:#e0703f;font-weight:800">phone-third</tspan><tspan> .&quot;</tspan></text>
<text x="40" y="226" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>    &quot;. . . . .&quot;;</tspan></text>
<text x="40" y="246" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>}</tspan></text>
<text x="40" y="266" class="code-sm" text-anchor="start" xml:space="preserve"><tspan></tspan></text>
<text x="40" y="286" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#3fa874">.l-phone-view-first</tspan><tspan>  { </tspan><tspan style="fill:#8a5cd1">grid-area</tspan><tspan>: </tspan><tspan style="fill:#3fa874;font-weight:800">phone-first</tspan><tspan>; }</tspan></text>
<text x="40" y="306" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">.l-phone-view-second</tspan><tspan> { </tspan><tspan style="fill:#8a5cd1">grid-area</tspan><tspan>: </tspan><tspan style="fill:#3b74d4;font-weight:800">phone-second</tspan><tspan>; }</tspan></text>
<text x="40" y="326" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#e0703f">.l-phone-view-third</tspan><tspan>  { </tspan><tspan style="fill:#8a5cd1">grid-area</tspan><tspan>: </tspan><tspan style="fill:#e0703f;font-weight:800">phone-third</tspan><tspan>; }</tspan></text>
