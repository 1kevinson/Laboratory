<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment App</title>
    <link rel="stylesheet" href="/src/scss/main.scss" />
  </head>
  <body>
    <div class="l-global-wrapper c-global-wrapper">
      <div class="c-phone-view l-phone-view-first c-phone-view-first">
        <div class="hello">
          <div class="hello-text">Good Morning, Frede 👋🏻</div>
          <div class="hello-bell">
            <div class="badge"></div>
            <div class="icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-bell-ring preview-icon"
              >
                <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                <path d="M22 8c0-2.3-.8-4.3-2-6" />
                <path
                  d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
                />
                <path d="M4 2C2.8 3.7 2 5.7 2 8" />
              </svg>
            </div>
          </div>
        </div>
        <div class="select-text">Select what you want more for now</div>
        <div class="select-box">
          <div class="select-box-1">
            <div class="avatar">
              <img
                src="https://api.dicebear.com/10.x/croodles/svg?baseColor=fafafa&inkColor=4a4d52&topColor=4a4d52&facialHairColor=4a4d52&glassesColor=4a4d52&eyepatchColor=4a4d52&seed=zk7u4v9p"
                alt="avatar"
              />
            </div>
            <div class="footer">
              <div class="link">Hang out</div>
              <div class="icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="64"
                  height="64"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-move-right preview-icon"
                >
                  <path d="M18 8L22 12L18 16" />
                  <path d="M2 12H22" />
                </svg>
              </div>
            </div>
          </div>
          <div class="select-box-2">
            <div class="avatar">
              <img
                src="https://api.dicebear.com/10.x/croodles/svg?baseColor=fafafa&inkColor=4a4d52&topColor=4a4d52&facialHairColor=4a4d52&glassesColor=4a4d52&eyepatchColor=4a4d52&seed=a76muhvb"
                alt="avatar"
              />
            </div>
            <div class="footer">
              <div class="link">Laugh</div>
              <div class="icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="64"
                  height="64"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-move-right preview-icon"
                >
                  <path d="M18 8L22 12L18 16" />
                  <path d="M2 12H22" />
                </svg>
              </div>
            </div>
          </div>
        </div>
        <div class="stress-indicator"></div>
        <div class="links"></div>
        <div class="footer-boxes">
          <div class="footer-boxes-1"></div>
          <div class="footer-boxes-2"></div>
          <div class="footer-boxes-3"></div>
        </div>
      </div>
      <div class="c-phone-view l-phone-view-second c-phone-view-second"></div>
      <div class="c-phone-view l-phone-view-third c-phone-view-third"></div>
    </div>
  </body>
</html>
