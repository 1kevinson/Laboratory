<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img" aria-labelledby="title">
<title id="title">How &amp; compiles in nested Sass, and the double-&amp; pitfall</title>
<defs><style>
.h{font:700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#1f1f1f}
.title{font:700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#1f1f1f}
.t15{font:700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#1f1f1f}
.t13{font:700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#1f1f1f}
.sub{font:400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#5c5c5c}
.lbl{font:400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#5c5c5c}
.sm{font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#5c5c5c}
.xs{font:400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#5c5c5c}
.num{font:700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#1f1f1f}
.code{font:500 13px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#1f1f1f}
.code-sm{font:500 12px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#333}
.code-xs{font:500 11px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#333}
.code-2xs{font:500 10px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#333}
.tag{font:700 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:.06em}
</style></defs>
<rect width="1100" height="590" rx="16" fill="#ffffff"/>
<text x="40" y="40" class="title" text-anchor="start">How &amp; compiles</text>
<text x="40" y="66" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a8a8a">context → </tspan><tspan style="fill:#3b74d4">.c-phone-view-second</tspan><tspan> { </tspan><tspan style="fill:#3b74d4">&amp; .things-item</tspan><tspan> { …rows 2–5 live here… } }</tspan></text>
<text x="46" y="100" class="t13" text-anchor="start">You write</text>
<text x="440" y="100" class="t13" text-anchor="start">Sass outputs</text>
<rect x="30" y="112" width="1040" height="60" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.4"/>
<text x="46" y="138" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">&amp; .things-item</tspan><tspan> { }</tspan></text>
<text x="46" y="158" class="xs" text-anchor="start">space after &amp; → descendant</text>
<text x="440" y="138" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">.c-phone-view-second</tspan><tspan> .things-item</tspan></text>
<text x="440" y="158" class="xs" text-anchor="start">the block, scoped to its screen</text>
<text x="1040" y="149" class="h" text-anchor="middle" style="fill:#3fa874">✓</text>
<rect x="30" y="182" width="1040" height="60" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.4"/>
<text x="46" y="208" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>  </tspan><tspan style="fill:#3fa874">&amp;-icon</tspan><tspan> { }</tspan></text>
<text x="46" y="228" class="xs" text-anchor="start">&amp; glued to text → suffix</text>
<text x="440" y="208" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>.c-phone-view-second </tspan><tspan style="fill:#3fa874">.things-item-icon</tspan></text>
<text x="440" y="228" class="xs" text-anchor="start">an element of the block</text>
<text x="1040" y="219" class="h" text-anchor="middle" style="fill:#3fa874">✓</text>
<rect x="30" y="252" width="1040" height="60" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.4"/>
<text x="46" y="278" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>  </tspan><tspan style="fill:#3fa874">&amp;-play</tspan><tspan> { </tspan><tspan style="fill:#8a5cd1">&amp;:hover</tspan><tspan> { } }</tspan></text>
<text x="46" y="298" class="xs" text-anchor="start">&amp; glued to a pseudo-class</text>
<text x="440" y="278" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>.c-phone-view-second .things-item-play</tspan><tspan style="fill:#8a5cd1">:hover</tspan></text>
<text x="440" y="298" class="xs" text-anchor="start">a state of the element</text>
<text x="1040" y="289" class="h" text-anchor="middle" style="fill:#3fa874">✓</text>
<rect x="30" y="322" width="1040" height="60" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.4"/>
<text x="46" y="348" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>  </tspan><tspan style="fill:#e0703f">&amp;--detox</tspan><tspan> .things-item-icon { }</tspan></text>
<text x="46" y="368" class="xs" text-anchor="start">modifier + element spelled out</text>
<text x="440" y="348" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>.c-phone-view-second </tspan><tspan style="fill:#e0703f">.things-item--detox</tspan><tspan> .things-item-icon</tspan></text>
<text x="440" y="368" class="xs" text-anchor="start">the icon inside a detox item</text>
<text x="1040" y="359" class="h" text-anchor="middle" style="fill:#3fa874">✓</text>
<rect x="30" y="392" width="1040" height="60" rx="10" fill="#fdf1f1" stroke="#e04848" stroke-width="2"/>
<text x="46" y="418" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>  </tspan><tspan style="fill:#e0703f">&amp;--detox</tspan><tspan> </tspan><tspan style="fill:#e04848">&amp;-icon</tspan><tspan> { }</tspan></text>
<text x="46" y="438" class="xs" text-anchor="start">&amp; used twice in one selector</text>
<text x="440" y="418" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>.c-phone-view-second .things-item--detox </tspan><tspan style="fill:#e04848">.c-phone-view-second</tspan><tspan> .things-item-icon</tspan></text>
<text x="440" y="438" class="xs" text-anchor="start" style="fill:#e04848">the phone would have to sit inside itself → never matches</text>
<text x="1040" y="429" class="h" text-anchor="middle" style="fill:#e04848">✗</text>
<rect x="30" y="462" width="1040" height="60" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.4"/>
<text x="46" y="488" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">.c-app-bar</tspan><tspan> { </tspan><tspan style="fill:#e0703f">&amp;--divided &amp;-title</tspan><tspan> { } }</tspan></text>
<text x="46" y="508" class="xs" text-anchor="start">at the root, &amp; is a single class</text>
<text x="440" y="488" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#e0703f">.c-app-bar--divided</tspan><tspan> .c-app-bar-title</tspan></text>
<text x="440" y="508" class="xs" text-anchor="start">fine: the parent is one class, nothing repeats</text>
<text x="1040" y="499" class="h" text-anchor="middle" style="fill:#3fa874">✓</text>
<text x="550" y="568" class="sub" text-anchor="middle">Rule: one &amp; per selector. To style an element of a modifier, write the element class in full.</text>
</svg>
