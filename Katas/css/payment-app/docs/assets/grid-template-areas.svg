<text x="670.0" y="95.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<text x="670.0" y="58" class="code-2xs" text-anchor="middle">$phone-width</text>
<rect x="740" y="70" width="120" height="40" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="800.0" y="95.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<text x="800.0" y="58" class="code-2xs" text-anchor="middle">$phone-width</text>
<rect x="870" y="70" width="120" height="40" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="930.0" y="95.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<text x="930.0" y="58" class="code-2xs" text-anchor="middle">$phone-width</text>
<rect x="1000" y="70" width="60" height="40" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="1030.0" y="95.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<text x="1030.0" y="58" class="code-2xs" text-anchor="middle">1fr</text>
<text x="1070" y="94.0" class="code-2xs" text-anchor="start">1fr</text>
<rect x="540" y="118" width="60" height="200" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="570.0" y="223.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<rect x="610" y="118" width="120" height="200" rx="8" fill="#e1f2e9" stroke="#3fa874" stroke-width="2.5"/>
<text x="670.0" y="222.0" class="code-xs" text-anchor="middle">phone-first</text>
<rect x="740" y="118" width="120" height="200" rx="8" fill="#e3ecf8" stroke="#3b74d4" stroke-width="2.5"/>
<text x="800.0" y="222.0" class="code-xs" text-anchor="middle">phone-second</text>
<rect x="870" y="118" width="120" height="200" rx="8" fill="#fbe8df" stroke="#e0703f" stroke-width="2.5"/>
<text x="930.0" y="222.0" class="code-xs" text-anchor="middle">phone-third</text>
<rect x="1000" y="118" width="60" height="200" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="1030.0" y="223.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<text x="1070" y="222.0" class="code-2xs" text-anchor="start">$phone-height</text>
<rect x="540" y="326" width="60" height="40" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="570.0" y="351.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<rect x="610" y="326" width="120" height="40" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="670.0" y="351.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<rect x="740" y="326" width="120" height="40" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="800.0" y="351.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<rect x="870" y="326" width="120" height="40" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="930.0" y="351.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<rect x="1000" y="326" width="60" height="40" rx="4" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="1030.0" y="351.0" class="t15" text-anchor="middle" style="fill:#8a8a8a">.</text>
<text x="1070" y="350.0" class="code-2xs" text-anchor="start">1fr</text>
<text x="540" y="390" class="sm" text-anchor="start">• one string = one row, one word = one cell</text>
<text x="540" y="411" class="sm" text-anchor="start">• the same name in neighbouring cells = one area (must stay a rectangle)</text>
<text x="540" y="432" class="sm" text-anchor="start">• &quot;.&quot; = an empty cell · every string must have the same number of cells</text>
</svg>
