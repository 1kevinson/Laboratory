<text x="550" y="314" class="code-xs" text-anchor="middle" style="fill:#8a5cd1">margin-inline-end: -$bleed</text>
<text x="550" y="332" class="sm" text-anchor="middle">→ cards slide off the real screen edge</text>
<text x="910" y="44" class="t15" text-anchor="middle" style="fill:#3fa874">3 · scroll-x — scroll end</text>
