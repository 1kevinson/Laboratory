<text x="56" y="424" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a8a8a">// base/_typography.scss</tspan></text>
<text x="56" y="444" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">p</tspan><tspan> { color: </tspan><tspan style="fill:#1f8a99">$color-muted</tspan><tspan>; }   </tspan><tspan style="fill:#e04848">← a declaration beats inheritance</tspan></text>
<line x1="300" y1="400" x2="300" y2="380" stroke="#e04848" stroke-width="1.8" marker-end="url(#me04848)"/>
<rect x="40" y="472" width="530" height="56" rx="10" fill="#ffffff" stroke="#3fa874" stroke-width="1.6"/>
<text x="56" y="496" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a8a8a">// components/_phone-view-second.scss</tspan></text>
<text x="56" y="516" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">.quote-text p</tspan><tspan> { color: </tspan><tspan style="fill:#3fa874">inherit</tspan><tspan>; }   </tspan><tspan style="fill:#3fa874">← take the parent&#x27;s again</tspan></text>
