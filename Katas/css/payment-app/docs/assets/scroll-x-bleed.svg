<text x="910" y="314" class="code-xs" text-anchor="middle" style="fill:#8a5cd1">padding-inline-end: $bleed</text>
<text x="910" y="332" class="sm" text-anchor="middle">→ last card aligns with the content edge</text>
<rect x="70" y="370" width="960" height="188" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="86" y="394" class="xs" text-anchor="start">abstracts/_mixins.scss — $bleed must equal the parent&#x27;s padding-inline</text>
<text x="86" y="416" class="code-sm" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a5cd1">@mixin</tspan><tspan> scroll-x(</tspan><tspan style="fill:#1f8a99">$gap</tspan><tspan>: $space-sm, </tspan><tspan style="fill:#1f8a99">$bleed</tspan><tspan>: $space-md) {</tspan></text>
<text x="86" y="436" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>  display: flex;  gap: $gap;</tspan></text>
<text x="86" y="456" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>  </tspan><tspan style="fill:#8a5cd1">margin-inline-end</tspan><tspan>: -$bleed;    </tspan><tspan style="fill:#8a8a8a">// 2 · grow the box into the parent&#x27;s padding</tspan></text>
<text x="86" y="476" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>  </tspan><tspan style="fill:#8a5cd1">padding-inline-end</tspan><tspan>: $bleed;    </tspan><tspan style="fill:#8a8a8a">// 3 · give the gutter back at the end of the scroll</tspan></text>
<text x="86" y="496" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>  overflow-x: auto;  scroll-snap-type: x mandatory;  scrollbar-width: none;</tspan></text>
<text x="86" y="516" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>  &gt; * { flex-shrink: 0; scroll-snap-align: start; }    </tspan><tspan style="fill:#8a8a8a">// cards keep their width and snap</tspan></text>
<text x="86" y="536" class="code-sm" text-anchor="start" xml:space="preserve"><tspan>}</tspan></text>
</svg>
