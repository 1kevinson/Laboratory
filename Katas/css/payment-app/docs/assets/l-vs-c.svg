<rect x="40" y="118" width="340" height="88" rx="12" fill="#ffffff" stroke="#3b74d4" stroke-width="1.6"/>
<text x="56" y="146" class="t13" text-anchor="start" style="fill:#3b74d4">WHERE · its slot in the parent grid</text>
<text x="56" y="172" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>grid-area: phone-first;</tspan></text>
<line x1="380" y1="162" x2="420" y2="160" stroke="#3b74d4" stroke-width="1.5" marker-end="url(#m3b74d4)"/>
<rect x="40" y="222" width="340" height="88" rx="12" fill="#ffffff" stroke="#3b74d4" stroke-width="1.6"/>
<text x="56" y="250" class="t13" text-anchor="start" style="fill:#3b74d4">HOW · its children flow</text>
<text x="56" y="276" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>display: flex; flex-direction: column;</tspan></text>
<line x1="380" y1="266" x2="446" y2="290" stroke="#3b74d4" stroke-width="1.5" marker-end="url(#m3b74d4)"/>
<rect x="40" y="326" width="340" height="88" rx="12" fill="#ffffff" stroke="#3b74d4" stroke-width="1.6"/>
<text x="56" y="354" class="t13" text-anchor="start" style="fill:#3b74d4">BETWEEN · the rhythm of the children</text>
<text x="56" y="380" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>gap: $space-md;</tspan></text>
<line x1="380" y1="370" x2="446" y2="354" stroke="#3b74d4" stroke-width="1.5" marker-end="url(#m3b74d4)"/>
<text x="720" y="104" class="code-sm" text-anchor="start" style="fill:#8a5cd1">.c-phone-view  +  .c-phone-view-first</text>
<rect x="720" y="118" width="350" height="88" rx="12" fill="#ffffff" stroke="#8a5cd1" stroke-width="1.6"/>
<text x="736" y="146" class="t13" text-anchor="start" style="fill:#8a5cd1">WHAT · the shared skin</text>
<text x="736" y="172" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>background · border-radius · overflow: hidden</tspan></text>
<line x1="720" y1="162" x2="680" y2="150" stroke="#8a5cd1" stroke-width="1.5" marker-end="url(#m8a5cd1)"/>
<rect x="720" y="222" width="350" height="88" rx="12" fill="#ffffff" stroke="#d4589f" stroke-width="1.6"/>
<text x="736" y="250" class="t13" text-anchor="start" style="fill:#d4589f">INSIDE · breathing room</text>
<text x="736" y="276" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>padding-inline: $space-md;</tspan></text>
<text x="736" y="294" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>padding-block: $space-lg;</tspan></text>
<line x1="720" y1="266" x2="672" y2="290" stroke="#d4589f" stroke-width="1.5" marker-end="url(#md4589f)"/>
<rect x="720" y="326" width="350" height="88" rx="12" fill="#ffffff" stroke="#d4589f" stroke-width="1.6"/>
<text x="736" y="354" class="t13" text-anchor="start" style="fill:#d4589f">CONTENT · its internals</text>
<text x="736" y="380" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>&amp; .hello { … }  &amp; .select-box { … }  …</tspan></text>
<line x1="720" y1="370" x2="640" y2="300" stroke="#d4589f" stroke-width="1.5" marker-end="url(#md4589f)"/>
<rect x="40" y="504" width="330" height="124" rx="12" fill="#e3ecf8" stroke="#3b74d4" stroke-width="1.6"/>
<text x="56" y="530" class="t13" text-anchor="start" style="fill:#3b74d4">l-xxx owns · outside &amp; flow</text>
<text x="56" y="556" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>grid-area · grid-column · grid-row</tspan></text>
<text x="56" y="578" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>display · grid-template-* · flex-direction</tspan></text>
<text x="56" y="600" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>gap · align-* · justify-* · place-*</tspan></text>
<rect x="390" y="504" width="330" height="124" rx="12" fill="#eee6fa" stroke="#8a5cd1" stroke-width="1.6"/>
<text x="406" y="530" class="t13" text-anchor="start" style="fill:#8a5cd1">c-xxx owns · skin &amp; inside</text>
<text x="406" y="556" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>background · color · border · radius · shadow</tspan></text>
<text x="406" y="578" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>padding · font-* · line-height</tspan></text>
<text x="406" y="600" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>its parts (&amp; .x) and their states</tspan></text>
<rect x="740" y="504" width="330" height="124" rx="12" fill="#fde4e4" stroke="#e04848" stroke-width="1.6"/>
<text x="756" y="530" class="t13" text-anchor="start" style="fill:#e04848">never on a c- root</text>
<text x="756" y="556" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>margin (spacing is the parent&#x27;s gap)</tspan></text>
<text x="756" y="578" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>grid-area or position to place itself</tspan></text>
<text x="756" y="600" class="code-2xs" text-anchor="start" xml:space="preserve"><tspan>a width that assumes its parent</tspan></text>
</svg>
