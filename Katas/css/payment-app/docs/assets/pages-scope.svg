<text x="983" y="368" class="code-2xs" text-anchor="middle">a utility .u-*</text>
<text x="550" y="420" class="xs" text-anchor="middle">Proposal: prefix page hooks with p- so the four prefixes read l- · c- · p- · u-</text>
