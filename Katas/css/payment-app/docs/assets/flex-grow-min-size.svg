<text x="720.0" y="486" class="xs" text-anchor="middle">… clipped, scroll for more</text>
<rect x="834" y="248" width="5" height="70" rx="2.5" fill="#8a8a8a"/>
<text x="874" y="288" class="sm" text-anchor="start" style="fill:#3fa874">scrolls inside</text>
<line x1="872" y1="294" x2="842" y2="308" stroke="#3fa874" stroke-width="1.6" marker-end="url(#m3fa874)"/>
<text x="210" y="40" class="title" text-anchor="middle" style="fill:#e04848">✗  flex: 1 alone</text>
<text x="210" y="62" class="xs" text-anchor="middle">min-height: auto (default) = never shrink below content</text>
<text x="730" y="40" class="title" text-anchor="middle" style="fill:#3fa874">✓  flex: 1 + min-height: 0</text>
<text x="730" y="62" class="xs" text-anchor="middle">the child may shrink, its list scrolls</text>
<rect x="40" y="600" width="380" height="62" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="56" y="624" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">.things</tspan><tspan> { </tspan><tspan style="fill:#8a5cd1">flex</tspan><tspan>: 1; }</tspan></text>
<text x="56" y="642" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#8a8a8a">// min-height: auto → grows with its content</tspan></text>
<rect x="560" y="560" width="420" height="80" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="576" y="584" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">.things</tspan><tspan>      { </tspan><tspan style="fill:#8a5cd1">flex</tspan><tspan>: 1; </tspan><tspan style="fill:#8a5cd1">min-height</tspan><tspan>: 0; }</tspan></text>
<text x="576" y="602" class="code-xs" text-anchor="start" xml:space="preserve"><tspan style="fill:#3b74d4">.things-list</tspan><tspan> { </tspan><tspan style="fill:#8a5cd1">flex</tspan><tspan>: 1; </tspan><tspan style="fill:#8a5cd1">min-height</tspan><tspan>: 0;</tspan></text>
<text x="576" y="620" class="code-xs" text-anchor="start" xml:space="preserve"><tspan>               </tspan><tspan style="fill:#8a5cd1">overflow-y</tspan><tspan>: auto; }</tspan></text>
